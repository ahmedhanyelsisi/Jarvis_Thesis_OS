jarvis:
  name: Jarvis Thesis OS
  version: 0.1

system:
  mode: research_assistant

memory:
  enabled: true
  database_path: "memory_database.sqlite"
  max_results: 10
  importance_threshold: 0.2

agents:

  writer:
    enabled: true

  latex:
    enabled: true

  reviewer:
    enabled: true

  diagram:
    enabled: true


thesis:
  path: "../My-Thesis"

reasoning:
  enabled: true
  mode: deterministic

planner:
  enabled: true

evaluation:
  enabled: true
