jarvis:
  name: "Jarvis Thesis OS"
  version: "0.1.0"
  mode: "development"

system:
  environment: "local"

ai:
  provider: "local"

memory:
  enabled: true
  database: "chromadb"

knowledge:
  enabled: true
  vector_database: "chromadb"
  embedding_provider: "local-hash"

agents:
  writer: true
  reviewer: true
  latex: true
  diagram: true

thesis:
  external_path: "../My-Thesis"

routing:

  literature_agent:
    keywords:
      - paper
      - article
      - literature
      - research
      - study

  latex_agent:
    keywords:
      - latex
      - equation
      - tex
      - compile

  reviewer_agent:
    keywords:
      - review
      - improve
      - check
      - critique
