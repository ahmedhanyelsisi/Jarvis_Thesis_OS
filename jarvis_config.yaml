jarvis:
  name: "Jarvis Thesis OS"
  version: "0.1.0"
  mode: "development"

system:
  environment: "local"

ai:
  provider: "local"

memory:
  enabled: true
  database_path: "memory_database.sqlite"
  max_results: 10
  importance_threshold: 0.2

knowledge:
  enabled: true
  vector_database: "chromadb"
  embedding_provider: "local-hash"

agents:
  writer: true
  reviewer: true
  latex: true
  diagram: true

thesis:
  enabled: true

  repository_root: "D:/Masters/Thesis_Repo/Thesis_Sisi"

  external_path: "D:/Masters/Thesis_Repo/Thesis_Sisi/Thesis/sisi/Templates"

  latex_root: "D:/Masters/Thesis_Repo/Thesis_Sisi/Thesis/sisi/Templates"

  main_file: "MAIN.tex"

  chapters_path: "Chapters"

  bibliography:
    - "MAIN.bib"
    - "BIB_AD.bib"

  build_engine: "miktex"

routing:

  literature_agent:
    keywords:
      - paper
      - article
      - literature
      - research
      - study

  latex_agent:
    keywords:
      - latex
      - equation
      - tex
      - compile

  reviewer_agent:
    keywords:
      - review
      - improve
      - check
      - critique

reasoning:
  enabled: true
  mode: "deterministic"
  memory_path: ".jarvis/reasoning_memory.json"

planner:
  enabled: true
  execution_mode: "sequential"

evaluation:
  enabled: true
  quality_threshold: 7
  max_improvement_iterations: 1

voice:
  enabled: true
  wake_word: Jarvis
  language: en
  provider: local
  speech_rate: normal
